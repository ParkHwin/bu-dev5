spring.application.name=glodenlink
# 1. Database Connection (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/goldenlink?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=admin12345

# 2. JPA / Hibernate Settings
# ddl-auto=update: Entity 클래스를 바탕으로 MySQL에 테이블을 자동 생성/수정합니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. View Engine (Thymeleaf)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 4. Encoding (한글 깨짐 방지)
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# 5. Logging (디버깅을 위해 에러 로그 상세 출력)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE